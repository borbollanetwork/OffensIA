[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offensia"
version = "0.1.0"
description = "Disciplined, evidence-driven offensive-security orchestration platform for authorized assessments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "mcp>=1.2.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
offensia = "offensia.core.cli:main"

[tool.setuptools.packages.find]
include = ["offensia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
